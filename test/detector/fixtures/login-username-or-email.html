<!-- Accesso in stile forge di codice: il campo accetta nome utente O email,
     quindi non è dichiarato type=email. Nessun alias nuovo va proposto qui. -->
<div class="auth-form-body">
  <form action="/session" method="post">
    <label for="login_field">Username or email address</label>
    <input type="text" name="login" id="login_field" autocapitalize="off" autocorrect="off">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password">
    <a href="/password_reset">Forgot password?</a>
    <input type="submit" name="commit" value="Sign in">
  </form>
</div>
