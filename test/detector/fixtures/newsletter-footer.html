<!-- Iscrizione a una newsletter nel piede della pagina: nessuna password,
     nessuna label, solo un placeholder. -->
<footer>
  <div class="newsletter">
    <p>Get the weekly digest. We will never share your email address with anyone.</p>
    <form action="/subscribe" method="post">
      <input type="text" name="EMAIL" placeholder="you@example.com">
      <button type="submit">Subscribe</button>
    </form>
  </div>
</footer>
