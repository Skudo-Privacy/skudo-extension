<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skudo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <img src="img/icon_32.png" width="22" height="22" alt="" />
      <span class="bar__name">Skudo</span>
      <button type="button" id="settings-toggle" class="icon-button" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <!-- Accesso -->
    <section id="screen-signin" class="screen" hidden>
      <p class="lede">Connect this browser to your Skudo account.</p>
      <label class="field">
        <span class="field__label">Server</span>
        <input type="url" id="instance" spellcheck="false" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field__label">API key</span>
        <input type="password" id="token" spellcheck="false" autocomplete="off" />
        <span class="field__hint">
          Create one under Advanced → API in your account. It is stored on this
          device only, never synced.
        </span>
      </label>
      <button type="button" id="signin" class="button button--primary">Sign in</button>
      <p class="error" id="signin-error" hidden></p>
    </section>

    <!-- Schermata principale -->
    <section id="screen-main" class="screen" hidden>
      <p class="site" id="site"></p>

      <button type="button" id="create" class="button button--primary">
        <span class="button__label">Create alias</span>
        <span class="spinner" hidden></span>
      </button>
      <p class="error" id="create-error" hidden></p>

      <!-- Bozza: finché non si preme Done, la descrizione non è salvata -->
      <div id="draft" class="card" hidden>
        <div class="alias">
          <code id="draft-email"></code>
          <button type="button" id="copy" class="icon-button" aria-label="Copy">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="9" y="9" width="11" height="11" rx="2.5" />
              <path d="M5.5 15H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v.5" />
            </svg>
          </button>
        </div>
        <label class="field">
          <span class="field__label">Note</span>
          <input type="text" id="draft-description" maxlength="200" placeholder="What is this for?" />
        </label>
        <div class="row">
          <button type="button" id="draft-discard" class="button button--quiet">Discard</button>
          <button type="button" id="draft-done" class="button button--primary">Done</button>
        </div>
      </div>

      <div id="existing" hidden>
        <h2 class="heading">Already on this site</h2>
        <ul class="list" id="existing-list"></ul>
      </div>
    </section>

    <!-- Impostazioni -->
    <section id="screen-settings" class="screen" hidden>
      <label class="switch">
        <input type="checkbox" id="opt-inject" />
        <span>
          <strong>Show an icon in email fields</strong>
          <small>Needs permission to read the pages you visit.</small>
        </span>
      </label>

      <label class="switch">
        <input type="checkbox" id="opt-menu" />
        <span>
          <strong>Right-click menu</strong>
          <small>Create an alias from any text field.</small>
        </span>
      </label>

      <label class="switch">
        <input type="checkbox" id="opt-describe" />
        <span>
          <strong>Note the site on each alias</strong>
          <small>So your alias list says where each one went.</small>
        </span>
      </label>

      <label class="field">
        <span class="field__label">Domain</span>
        <select id="opt-domain"></select>
      </label>

      <label class="field">
        <span class="field__label">Format</span>
        <select id="opt-format">
          <option value="random_characters">Random characters</option>
          <option value="random_words">Random words</option>
          <option value="uuid">UUID</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Appearance</span>
        <select id="opt-theme">
          <option value="auto">Match the browser</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <span class="field__hint">
          Browsers that resist fingerprinting always report a light theme.
          Choose it here instead.
        </span>
      </label>

      <button type="button" id="signout" class="button button--quiet">Sign out</button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
